# Static analysis config. `flutter analyze` must stay at 0 errors.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Opt-in modules copied into lib/ on demand; they reference packages this
    # template does not depend on, so they are not analysed here.
    - modules/**

  errors:
    # Dead assets and unrouted screens are bugs, not style notes.
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    # Correctness
    - unrelated_type_equality_checks # caught the dead offline guard: List<ConnectivityResult> == ConnectivityResult.none
    - unnecessary_null_checks # a needless `!` hides where null is actually possible
    - use_build_context_synchronously # a BuildContext used after an await may already be unmounted
    - no_adjacent_strings_in_list # two adjacent strings in a list are almost always a missing comma
    - collection_methods_unrelated_type # list.contains(wrongType) silently returns false
    - depend_on_referenced_packages # importing a transitive package breaks when it is dropped upstream

    # Naming — these are what let the guardrail tests in test/guardrails stay simple
    - file_names # lower_snake_case files; file_naming_test enforces the same rule
    - camel_case_types
    - constant_identifier_names # pinned public names (AppRoutes, SnackBarType) opt out per file
    - non_constant_identifier_names
    - library_prefixes

    # House style
    - prefer_single_quotes # single quotes dominate the repo and every hand-written widget
    - require_trailing_commas # keeps dart format diffs one-line-per-argument; cost was 0 violations
    - always_declare_return_types # an inferred `dynamic` return leaks untyped values downstream
    - prefer_final_locals
    - avoid_print # use devPrint — print() survives into release builds
    - sort_child_properties_last

  # Deliberately NOT enabled — each was measured, not skipped:
  #
  # avoid_dynamic_calls — 42 hits, all `response.data[...]` / `json[...]`. The pinned
  #   Style-A repo contract returns the raw Dio Response as `dynamic` on purpose, so
  #   the only fix is a cast at every call site. Worth doing as its own typed-response
  #   pass; enabling it now would just add 42 ignored infos.
  #
  # unawaited_futures — 19 hits, all `Get.toNamed` / `Get.offAllNamed`. GetX navigation
  #   is fire-and-forget by design; the rule would force `unawaited(...)` noise on every
  #   route change without catching a single real bug.
