name: connectivity_banner
description: >-
  Offline awareness: a ConnectivityService (GetxService) with a reactive
  isOnline flag, an animated OfflineBanner that slides in when the network
  drops and confirms when it returns, and a ConnectivityGuard that fails a
  network action fast with a friendly message.

# Copy each path from modules/connectivity_banner/<path> to <path> in the project.
files:
  - lib/app/services/connectivity_service.dart
  - lib/app/services/connectivity_guard.dart
  - lib/app/widgets/feedback/offline_banner.dart

# connectivity_plus already ships in core — the installer will skip it.
dependencies:
  connectivity_plus: ^7.3.1

setup:
  - >-
    lib/bootstrap.dart, before runApp(const App()):
    Get.put(ConnectivityService(), permanent: true);
  - >-
    lib/app/app.dart, inside GetMaterialApp:
    builder: OfflineBanner.builder(),

routes: >-
  None. This module adds no screens, so AppRoutes and AppPages are untouched.

bindings: >-
  None required. ConnectivityService is a permanent GetxService registered in
  bootstrap.dart, not a screen controller. If you prefer bindings, put the same
  Get.put line in ViewModelBinding.dependencies() instead.

core_dependencies:
  - lib/app/services/domain/dev_tools.dart
  - lib/app/widgets/feedback/custom_snack_bar.dart
  - lib/app/utils/constants/app_colors.dart
  - lib/app/utils/constants/app_fonts.dart
  - lib/app/utils/responsive_utils.dart

optional_integration: >-
  lib/app/widgets/feedback/feedback.dart is a barrel — add
  export 'offline_banner.dart'; so the widget kit re-exports it.

platform_config:
  android:
    manifest_permissions: >-
      ACCESS_NETWORK_STATE is merged in from the connectivity_plus manifest, so
      nothing to add. Declare
      <uses-permission android:name="android.permission.INTERNET"/> inside
      <manifest> if it is not there yet — release builds need it for the DNS
      reachability probe.
  ios: >-
    None. No Info.plist keys and no entitlements.
  macos: >-
    Tick "Incoming/Outgoing Connections (Client)" in both
    macos/Runner/DebugProfile.entitlements and Release.entitlements.
  notes: >-
    Web is not supported as shipped: the reachability probe uses
    dart:io InternetAddress.lookup. Set
    ConnectivityService.to.verifyReachability = false to run on radio state only.

notes: >-
  connectivity_plus v7 returns List<ConnectivityResult>, never a bare enum -
  the service treats "every result is none" (or an empty list) as offline,
  matching the corrected checkInternet() in
  lib/app/services/domain/api_service.dart. The radio being up is not proof of
  egress, so isOnline is confirmed with a DNS lookup of
  ConnectivityService.to.probeHost (default google.com, 4s timeout). The banner
  registers the service itself if bootstrap never did, so it is safe to drop in
  before wiring.
